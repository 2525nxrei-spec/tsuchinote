# ツチノート - Cloudflare Workers設定
name = "tsuchinote"
main = "worker/src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 開発用ローカルポート
[dev]
port = 8788

# 静的アセット（PWAフロントエンド）
[assets]
directory = "./public"

# D1データベース バインディング
[[d1_databases]]
binding = "DB"
database_name = "tsuchinote-db"
database_id = "8bcb8802-3b89-4fb5-b1d9-92a1ad1aa51b"

# R2オブジェクトストレージ バインディング（画像等）
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "tsuchinote-storage"

# 環境変数（シークレットは wrangler secret put で設定）
[vars]
APP_URL = "https://tsuchinote.pages.dev"
STRIPE_PRICE_LIGHT = "price_1TF9k09Fc8HnuaokrMmKlFo4"
STRIPE_PRICE_PRO = "price_1TFA2Y9Fc8Hnuaokitufi136"

# 本番環境
[env.production]
name = "tsuchinote"
[env.production.vars]
APP_URL = "https://tsuchinote.pages.dev"
STRIPE_PRICE_LIGHT = "price_1TF9k09Fc8HnuaokrMmKlFo4"
STRIPE_PRICE_PRO = "price_1TFA2Y9Fc8Hnuaokitufi136"

# ステージング環境
[env.staging]
name = "tsuchinote-staging"
[env.staging.vars]
APP_URL = "https://staging.tsuchinote.pages.dev"
