# ============================================================
# ツチノート — Cloudflare Pages 設定
# ============================================================

name = "tsuchinote"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./public"

# 開発用ローカルポート
[dev]
port = 8788

# D1データベース バインディング
[[d1_databases]]
binding = "DB"
database_name = "tsuchinote-db"
database_id = "8bcb8802-3b89-4fb5-b1d9-92a1ad1aa51b"

# R2オブジェクトストレージ バインディング（画像等）
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "tsuchinote-storage"

# 環境変数（シークレットは wrangler pages secret put で設定）
# wrangler pages secret put STRIPE_SECRET_KEY --project-name tsuchinote
# wrangler pages secret put STRIPE_WEBHOOK_SECRET --project-name tsuchinote
[vars]
APP_URL = "https://tsuchinote.com"
STRIPE_PRICE_LIGHT = "price_1TF9k09Fc8HnuaokrMmKlFo4"
STRIPE_PRICE_PRO = "price_1TFA2Y9Fc8Hnuaokitufi136"
# Stripe公開鍵（Embedded Checkout用）— Cloudflareダッシュボードで本番値を設定
STRIPE_PUBLISHABLE_KEY = ""

# ============================================================
# 本番環境
# ============================================================
[env.production]
name = "tsuchinote"
[env.production.vars]
APP_URL = "https://tsuchinote.com"
STRIPE_PRICE_LIGHT = "price_1TF9k09Fc8HnuaokrMmKlFo4"
STRIPE_PRICE_PRO = "price_1TFA2Y9Fc8Hnuaokitufi136"
# Stripe公開鍵（Embedded Checkout用）— Cloudflareダッシュボードで本番値を設定
STRIPE_PUBLISHABLE_KEY = ""

# ============================================================
# プレビュー環境
# ============================================================
[env.preview]
name = "tsuchinote-staging"
[env.preview.vars]
APP_URL = "https://staging.tsuchinote.pages.dev"

# D1 binding verified 2026-04-03
