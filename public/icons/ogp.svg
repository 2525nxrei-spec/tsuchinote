<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d6a4f"/>
      <stop offset="70%" stop-color="#40916c"/>
      <stop offset="85%" stop-color="#5a7d4a"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <!-- 太陽の光彩 -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD93D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFD93D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景グラデーション -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 装飾の丸（温かみ） -->
  <circle cx="150" cy="500" r="180" fill="#52b788" opacity="0.08"/>
  <circle cx="1050" cy="120" r="220" fill="#52b788" opacity="0.06"/>
  <circle cx="600" cy="600" r="300" fill="#8B6914" opacity="0.1"/>

  <!-- 下部の土イメージ（波型） -->
  <path d="M0,570 Q150,545 300,560 Q450,575 600,555 Q750,535 900,555 Q1050,575 1200,560 L1200,630 L0,630 Z" fill="#7a5c12" opacity="0.4"/>
  <path d="M0,590 Q200,570 400,585 Q600,600 800,580 Q1000,560 1200,580 L1200,630 L0,630 Z" fill="#8B6914" opacity="0.35"/>

  <!-- 小さな草のアクセント（土の上） -->
  <g opacity="0.3">
    <path d="M180,570 Q185,555 190,570" stroke="#74c69d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M185,570 Q182,550 178,570" stroke="#95d5b2" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M820,565 Q825,548 830,565" stroke="#74c69d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M825,565 Q822,545 818,565" stroke="#95d5b2" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M1020,575 Q1025,560 1030,575" stroke="#74c69d" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ========== 左側: 天気アイコン ========== -->
  <g transform="translate(220, 220)">
    <!-- 太陽の光彩 -->
    <circle cx="0" cy="0" r="80" fill="url(#sunGlow)"/>

    <!-- 太陽本体 -->
    <circle cx="0" cy="-10" r="32" fill="#FFD93D"/>

    <!-- 太陽の光線 -->
    <g stroke="#FFD93D" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <line x1="0" y1="-52" x2="0" y2="-62"/>
      <line x1="28" y1="-38" x2="35" y2="-46"/>
      <line x1="42" y1="-10" x2="52" y2="-10"/>
      <line x1="-28" y1="-38" x2="-35" y2="-46"/>
      <line x1="-42" y1="-10" x2="-52" y2="-10"/>
      <line x1="20" y1="-52" x2="24" y2="-58"/>
      <line x1="-20" y1="-52" x2="-24" y2="-58"/>
    </g>

    <!-- 雲（太陽の前） -->
    <g transform="translate(10, 10)">
      <ellipse cx="-10" cy="10" rx="35" ry="22" fill="white" opacity="0.9"/>
      <ellipse cx="20" cy="8" rx="28" ry="20" fill="white" opacity="0.9"/>
      <ellipse cx="-30" cy="14" rx="22" ry="16" fill="white" opacity="0.85"/>
      <ellipse cx="5" cy="0" rx="25" ry="18" fill="white" opacity="0.95"/>
    </g>

    <!-- 温度計 -->
    <g transform="translate(-50, 50)">
      <!-- 温度計の管 -->
      <rect x="-6" y="-30" width="12" height="55" rx="6" fill="white" opacity="0.9"/>
      <!-- 温度計の球 -->
      <circle cx="0" cy="32" r="12" fill="white" opacity="0.9"/>
      <!-- 水銀（赤） -->
      <rect x="-3" y="-15" width="6" height="42" rx="3" fill="#e63946"/>
      <circle cx="0" cy="32" r="8" fill="#e63946"/>
      <!-- 目盛り -->
      <line x1="8" y1="-20" x2="14" y2="-20" stroke="white" stroke-width="1.5" opacity="0.6"/>
      <line x1="8" y1="-10" x2="14" y2="-10" stroke="white" stroke-width="1.5" opacity="0.6"/>
      <line x1="8" y1="0" x2="14" y2="0" stroke="white" stroke-width="1.5" opacity="0.6"/>
      <line x1="8" y1="10" x2="14" y2="10" stroke="white" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- 「天気」ラベル -->
    <text x="0" y="110" text-anchor="middle" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="18" fill="#b7e4c7" opacity="0.7">天気・気温</text>
  </g>

  <!-- ========== 右側: カレンダー風チェックリスト ========== -->
  <g transform="translate(900, 170)">
    <!-- カレンダーの影 -->
    <rect x="-82" y="-48" width="164" height="195" rx="14" fill="#1b4332" opacity="0.15"/>

    <!-- カレンダー本体 -->
    <rect x="-85" y="-52" width="164" height="195" rx="12" fill="white" opacity="0.92"/>

    <!-- カレンダー上部（ヘッダー） -->
    <rect x="-85" y="-52" width="164" height="42" rx="12" fill="#52b788" opacity="0.9"/>
    <rect x="-85" y="-22" width="164" height="12" fill="#52b788" opacity="0.9"/>

    <!-- カレンダーのリング -->
    <rect x="-55" y="-62" width="8" height="20" rx="4" fill="#40916c"/>
    <rect x="-20" y="-62" width="8" height="20" rx="4" fill="#40916c"/>
    <rect x="15" y="-62" width="8" height="20" rx="4" fill="#40916c"/>
    <rect x="50" y="-62" width="8" height="20" rx="4" fill="#40916c"/>

    <!-- 「今日やること」テキスト -->
    <text x="-3" y="-24" text-anchor="middle" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="16" font-weight="bold" fill="white">今日やること</text>

    <!-- チェックリスト項目 -->
    <!-- 項目1（チェック済み） -->
    <rect x="-65" y="5" width="18" height="18" rx="4" fill="#52b788" opacity="0.2" stroke="#52b788" stroke-width="1.5"/>
    <path d="M-61,15 L-57,19 L-51,9" stroke="#52b788" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-40" y="9" width="90" height="10" rx="5" fill="#74c69d" opacity="0.3"/>

    <!-- 項目2（チェック済み） -->
    <rect x="-65" y="35" width="18" height="18" rx="4" fill="#52b788" opacity="0.2" stroke="#52b788" stroke-width="1.5"/>
    <path d="M-61,45 L-57,49 L-51,39" stroke="#52b788" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-40" y="39" width="75" height="10" rx="5" fill="#74c69d" opacity="0.3"/>

    <!-- 項目3（未チェック） -->
    <rect x="-65" y="65" width="18" height="18" rx="4" fill="transparent" stroke="#adb5bd" stroke-width="1.5"/>
    <rect x="-40" y="69" width="85" height="10" rx="5" fill="#ced4da" opacity="0.3"/>

    <!-- 項目4（未チェック） -->
    <rect x="-65" y="95" width="18" height="18" rx="4" fill="transparent" stroke="#adb5bd" stroke-width="1.5"/>
    <rect x="-40" y="99" width="65" height="10" rx="5" fill="#ced4da" opacity="0.3"/>

    <!-- 「やること」ラベル -->
    <text x="-3" y="165" text-anchor="middle" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="18" fill="#b7e4c7" opacity="0.7">やることリスト</text>
  </g>

  <!-- ========== 中央: ロゴ ========== -->
  <!-- 芽のアイコン（小さめ） -->
  <g transform="translate(600, 195)">
    <line x1="0" y1="15" x2="0" y2="45" stroke="#b7e4c7" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="-16" cy="8" rx="16" ry="10" fill="#95d5b2" transform="rotate(-35, -16, 8)"/>
    <ellipse cx="16" cy="8" rx="16" ry="10" fill="#b7e4c7" transform="rotate(35, 16, 8)"/>
    <ellipse cx="0" cy="48" rx="10" ry="7" fill="#74c69d"/>
  </g>

  <!-- サービス名 -->
  <text x="600" y="310" text-anchor="middle" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="76" font-weight="bold" fill="#ffffff" letter-spacing="10">ツチノート</text>

  <!-- キャッチコピー -->
  <text x="600" y="380" text-anchor="middle" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="26" fill="#d8f3dc" letter-spacing="2">畑の天気と今日やること、毎朝届けます</text>

  <!-- 区切りライン -->
  <rect x="460" y="405" width="280" height="2" rx="1" fill="#b7e4c7" opacity="0.35"/>

  <!-- 会社名 -->
  <text x="600" y="450" text-anchor="middle" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="16" fill="#b7e4c7" opacity="0.5">株式会社 礼</text>
</svg>