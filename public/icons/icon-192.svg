<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- 丸い緑のバッジ -->
  <circle cx="96" cy="96" r="90" fill="#2d6a4f"/>
  <!-- 白い葉っぱの芽 -->
  <g transform="translate(96,100)" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 茎 -->
    <path d="M0,32 C0,10 0,-5 0,-5"/>
    <!-- 左の葉 -->
    <path d="M0,8 C-8,-2 -30,-10 -34,-18 C-28,-10 -14,0 0,8Z" fill="#fff" stroke="none"/>
    <!-- 右の葉（大きめ） -->
    <path d="M0,-5 C10,-18 34,-30 40,-42 C30,-28 12,-10 0,-5Z" fill="#fff" stroke="none"/>
    <!-- 葉脈（左） -->
    <path d="M0,8 C-12,-4 -24,-10 -30,-16" stroke="#2d6a4f" stroke-width="2"/>
    <!-- 葉脈（右） -->
    <path d="M0,-5 C14,-18 26,-28 34,-38" stroke="#2d6a4f" stroke-width="2"/>
    <!-- 土の粒 -->
    <circle cx="-14" cy="38" r="5" fill="#fff" stroke="none"/>
    <circle cx="0" cy="42" r="6" fill="#fff" stroke="none"/>
    <circle cx="16" cy="38" r="5" fill="#fff" stroke="none"/>
    <circle cx="-6" cy="34" r="3.5" fill="#fff" stroke="none"/>
    <circle cx="8" cy="35" r="4" fill="#fff" stroke="none"/>
  </g>
</svg>
