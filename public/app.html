  <title>ツチノート</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>
    // 古いService Workerキャッシュを自動クリア
    (function() {
      var TARGET = 'tsuchinote-v6';
      if (navigator.serviceWorker) {
        caches.keys().then(function(keys) {
          var stale = keys.filter(function(k) { return k !== TARGET; });
          if (stale.length === 0) return;
          Promise.all(stale.map(function(k) { return caches.delete(k); })).then(function() {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
              if (!sessionStorage.getItem('sw_cleared')) {
                sessionStorage.setItem('sw_cleared', '1');
                location.reload();
              }
            });
          });
        });
      }
    })();
  </script>
</head>
