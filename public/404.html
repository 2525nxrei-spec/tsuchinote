<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>ページが見つかりません - ツチノート</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,'Noto Sans JP',sans-serif;color:#1b4332;background:#f0f7f2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
    .code{font-size:clamp(5rem,15vw,8rem);font-weight:800;color:#d1e7d5;line-height:1}
    h1{font-size:1.4rem;font-weight:700;margin:16px 0 12px}
    p{font-size:0.95rem;color:#4a7856;line-height:1.8;margin-bottom:32px}
    .btn{display:inline-block;background:#1b4332;color:#fff;font-size:0.9rem;font-weight:600;padding:14px 36px;border-radius:12px;text-decoration:none;transition:opacity 0.2s}
    .btn:hover{opacity:0.85}
    .footer{position:fixed;bottom:16px;font-size:0.72rem;color:#8aab91}
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>ページが見つかりません</h1>
  <p>お探しのページは移動または削除された可能性があります。<br>URLをご確認ください。</p>
  <a href="/app.html" class="btn">トップページへ戻る</a>
  <div class="footer">&copy; 2026 ツチノート</div>
</body>
</html>
